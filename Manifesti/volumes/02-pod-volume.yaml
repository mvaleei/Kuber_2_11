apiVersion: v1 
kind: Pod  

metadata:
  name: shared-volume-pod 
  namespace: corso  
spec:
  containers:
    - name: writer 
      image: busybox  
      command: ["sh" , "-c"] 
      args:
        - | 
          echo "writer avviato";
          while true; do 
            date >> /data/filelog.txt;  
            sleep 2
          done
      volumeMounts:
        - name: shared-data  
          mountPath: /data
    - name: reader  
      image: alpine:3.20 
      command: ["sh" , "-c"] 
      args:
        - | 
          echo "writer avviato";
          while true; do 
            tail -n 3 /data/filelog.txt;  
            sleep 3
          done      
      volumeMounts:
        - name: shared-data  
          mountPath: /data  
          readOnly: true

  volumes:
    - name: shared-data  
      emptyDir: {}
