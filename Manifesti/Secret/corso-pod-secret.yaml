apiVersion: v1
kind: Pod 

metadata:
  name: corso-pod-secret  
  namespace: corso 


spec: 
  containers:
    - name: pod-test-secret   
      image: busybox  
      command: ["sh", "-c", "echo $utenteLetto - $passWordLetta && sleep 3600"]
      env:
        - name: utenteLetto
          valueFrom:
            secretKeyRef:
              name: secret-database 
              key: userName

        - name: passWordLetta
          valueFrom:
            secretKeyRef:
              name: secret-database 
              key: passWord             