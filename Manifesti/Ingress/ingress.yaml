apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ingress-ingress
  namespace: corso

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /negozio
            pathType: Prefix #/tutti/c   /clienti/4
            backend:
              service:
                name: negozio-service
                port:
                  number: 80
          - path: /tutti
            pathType: Prefix #/tutti/c   /clienti/4
            backend:
              service:
                name: immobili-service
                port:
                  number: 80
