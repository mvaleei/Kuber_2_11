apiVersion: apps/v1  
kind: Deployment   

metadata:
  name: negozio-api-deployment  
  namespace: corso   

spec:
  replicas: 2

  selector:
    matchLabels:
      app: negozio-api
  template:
    metadata:
      labels:
        app: negozio-api  

    spec:
      containers:
        - name: negozio-api
          image: ghostmio/serviziojava-docker-package:v1
          ports:
            - containerPort: 8080
