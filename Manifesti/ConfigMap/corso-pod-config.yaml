apiVersion: v1  
kind: Pod

metadata: 
  name: corso-pod-config 
  namespace: corso 

spec:
  containers:
    - name: pod-test 
      image: busybox  
      command: ["sh" , "-c", "echo $messaggioLetto - $tipologia && sleep 3600"]
      env:
        - name: messaggioLetto
          valueFrom:
            configMapKeyRef:
              name: corso-config
              key: MESSAGGIO  
        - name: tipologia 
          valueFrom:
            configMapKeyRef:
              name: corso-config
              key: MODO